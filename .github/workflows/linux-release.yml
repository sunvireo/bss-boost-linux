name: Build Bss Booster Linux App
on:
  workflow_dispatch:
  push:
    paths:
      - 'bss_booster/**'
      - 'tests/**'
      - 'assets/**'
      - 'main.py'
      - 'requirements-linux.txt'
      - 'build_linux.sh'
      - 'run_linux.sh'
      - 'WAYLAND_QUICK_START.txt'
      - 'START_LINUX_HERE.md'
      - 'install_linux_binary.sh'
      - '.github/workflows/linux-release.yml'
jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install Python on build machine (not user's Linux PC)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build and X11 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xfixes0 \
            libxcb-shape0 libegl1 libopengl0
          python -m pip install --upgrade pip
          python -m pip install -r requirements-linux.txt 'pyinstaller>=6,<7' pytest
      - name: Run all tests including the GUI smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests
      - name: Build Linux executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name BssBooster \
            --add-data 'assets/bss_booster_icon.png:assets' \
            --add-data 'assets/booster_alarm.wav:assets' \
            main.py
          chmod +x dist/BssBooster
      - name: Test app can start on virtual X11 desktop
        run: |
          set -e
          xvfb-run -a sh -c 'QT_QPA_PLATFORM=xcb timeout 8s ./dist/BssBooster > /tmp/bss-linux-smoke.log 2>&1' || status=$?
          cat /tmp/bss-linux-smoke.log || true
          if [ "${status:-0}" -ne 0 ] && [ "${status:-0}" -ne 124 ]; then
            echo 'Linux binary failed its startup check'
            exit 1
          fi
      - name: Package Linux app
        run: |
          mkdir -p linux_release
          cp dist/BssBooster linux_release/BssBooster
          cp assets/bss_booster_icon.png linux_release/bss_booster_icon.png
          cp START_LINUX_HERE.md linux_release/START_LINUX_HERE.md
          cp WAYLAND_QUICK_START.txt linux_release/WAYLAND_QUICK_START.txt
          cat > linux_release/README-LINUX.txt <<'EOF'
          BSS BOOSTER FOR LINUX (x86_64)

          Extract this archive and run: ./BssBooster
          If needed, make it executable first: chmod +x BssBooster
          Python is NOT needed to run this binary.

          Linux macro helpers (Ubuntu/Debian):
            X11: sudo apt install xdotool espeak-ng pulseaudio-utils
            Wayland: sudo apt install ydotool espeak-ng pulseaudio-utils

          WAYLAND IMPORTANT:
            Configure the system ydotoold daemon/service so ydotool can
            connect to its /dev/uinput-backed virtual keyboard. Do not
            change uinput permissions insecurely or run Bss Booster as root.
            Wayland has no universal foreground-title check: macro input
            remains blocked until the user explicitly disables focus-only
            protection in Settings. Then keys go to whatever has focus.
            Global hotkeys require manually assigned desktop shortcuts, e.g.
            /path/to/BssBooster --control start
            /path/to/BssBooster --control pause
            /path/to/BssBooster --control stop
            /path/to/BssBooster --control alarm:Glitter
            Qt will default to XWayland (xcb) when DISPLAY is available;
            overlay placement/always-on-top isn't universal on Wayland.

          Full illustrated setup instructions: START_LINUX_HERE.md

          This is an unsigned community utility. Inspect its source and
          verify the GitHub Actions origin before executing.
          EOF
          tar -czf BssBooster-Linux-x86_64.tar.gz -C linux_release .
      - name: Upload downloadable Linux build
        uses: actions/upload-artifact@v4
        with:
          name: BssBooster-Linux-x86_64
          path: BssBooster-Linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30
